name: Update F1 Archives

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Anno da esportare (2018-2026)"
        type: choice
        required: true
        options: ["2018", "2019", "2020", "2021", "2022", "2023", "2024", "2025", "2026"]
      mode:
        description: "Modalità: compact = giro più veloce per pilota (consigliata, file piccoli)"
        type: choice
        default: "compact"
        options: ["compact", "full"]
      sessions:
        description: "Sessioni da includere (race-quali-fp = weekend completo classico)"
        type: choice
        default: "race"
        options: ["race", "quali", "race-quali", "race-quali-fp", "all"]
      rounds:
        description: "Round facoltativi, es. 1-12,14 (vuoto = tutti). Utile per spezzare un anno in più esecuzioni."
        type: string
        default: ""
      force:
        description: "Riesporta anche le sessioni già presenti (serve per aggiungere il compound gomme ai file esistenti)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update-archives
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FastF1
        run: pip install 'fastf1>=3.4,<4'

      - name: Export sessions (scarica i flussi grezzi solo per le sessioni richieste)
        env:
          # Opzionali: account F1 gratuito (formula1.com) → Settings → Secrets → Actions.
          # Con le credenziali il download usa direttamente livetiming.formula1.com
          # (tutte le stagioni); senza, FastF1 prova il mirror pubblico (copertura parziale).
          F1_USERNAME: ${{ secrets.F1_USERNAME }}
          F1_PASSWORD: ${{ secrets.F1_PASSWORD }}
        run: |
          python public/history/export_fastf1_sessions.py \
            --year "${{ github.event.inputs.year }}" \
            --mode "${{ github.event.inputs.mode }}" \
            --sessions "${{ github.event.inputs.sessions }}" \
            --rounds "${{ github.event.inputs.rounds }}" \
            $( [ "${{ github.event.inputs.force }}" = "true" ] && echo --force )

      - name: Guardia dimensione (nessun file oltre 95 MB, limite Git 100 MB)
        run: |
          big=$(find public/data/archives -type f -size +95M || true)
          if [ -n "$big" ]; then
            echo "File troppo grandi per il repository:"; echo "$big"; exit 1
          fi

      - name: Commit archives
        id: autocommit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(archives): ${{ github.event.inputs.year }} ${{ github.event.inputs.sessions }} (${{ github.event.inputs.mode }})"
          file_pattern: "public/data/archives/**"

      # Il push fatto con GITHUB_TOKEN non attiva altri workflow: GitHub lo
      # blocca per evitare ricorsioni (workflow_dispatch è l'unica eccezione).
      # Quindi, dopo il commit degli archivi, richiamiamo esplicitamente il deploy.
      - name: Trigger Pages deploy
        if: steps.autocommit.outputs.changes_detected == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
